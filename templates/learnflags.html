<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Flagship</title>
    <link rel="icon" href="{{ url_for('static', filename='ljiljan.png') }}" sizes="16x16 32x32" type="image/png">
</head>
<body class="wide-page">
    <nav class="navbar navbar-expand-lg navbar-light">
        <a class="navbar-brand" href="/">Flagship</a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item"><a class="nav-link{% if request.path == '/' %} active{% endif %}" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link{% if request.path == '/game' %} active{% endif %}" href="/game">Play</a></li>
                <li class="nav-item"><a class="nav-link{% if request.path == '/about' %} active{% endif %}" href="/about">About</a></li>
                <li class="nav-item"><a class="nav-link{% if request.path == '/learnflags' %} active{% endif %}" href="/learnflags">Learn</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-5 text-center">
        <h1>Discover the Flags of our World</h1>
        <p>Explore the diverse flags of countries around the globe. Tap a name to read more on Wikipedia.</p>
        <input type="search" id="flagSearch" class="form-control flag-search" placeholder="🔍 Find a flag…" aria-label="Search flags">
        <p class="no-results" id="noResults">No flags on the horizon. Try another name! 🔭</p>
        <div class="row">
            {% for country in countries %}
            <div class="col-md-4 flag-col" data-name="{{ country['name'] | lower }}">
                <div class="card mb-4 flag-card">
                    <img src="{{ url_for('static', filename=country['flag']) }}" class="card-img-top" alt="Flag of {{ country['name'] }}" loading="lazy">
                    <div class="card-body">
                        <h5 class="card-title">
                            <a href="#" class="wiki-link" data-country="{{ country['name'] }}">{{ country['name'] }}</a>
                        </h5>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <footer class="text-center footer-container">
        <div class="d-flex justify-content-center align-items-center">
            <p class="mb-0">&copy; MAYA</p>
        </div>
    </footer>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script src="{{ url_for('static', filename='fetch_wiki.js') }}"></script>
</body>
</html>
